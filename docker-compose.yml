services:
  backend:
    image: muhammadzaid673/shopsphere-backend:v1
    container_name: shopsphere-backend
    env_file:
      - ./backend-python/.env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17
    container_name: shopsphere-postgres
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: shopsphere-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: